name: Daily Weather ETL

on:
  schedule:
    # 00:00 UTC = 08:00 Philippine Standard Time.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-etl
  cancel-in-progress: false

jobs:
  weather-etl:
    name: Extract, transform, and load Philippine weather
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure database connection
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python scripts/configure_ci_database.py

      - name: Execute weather pipeline
        run: |
          mkdir -p logs
          python -m src.main 2>&1 | tee logs/weather_etl.log

      - name: Retain weather data and diagnostic logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: weather-etl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/raw/*.json
            data/processed/**/*.csv
            logs/weather_etl.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize run
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '### Philippine Weather ETL\n\nResult: **%s**\n\nSee step logs and the weather-etl artifact for diagnostics.\n' "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: ${{ failure() }}
        run: echo '::error::Weather ETL failed. Check database secrets, connectivity, the schema, and pipeline logs.'
